<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add_record</title>
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="alert {{ category }}">{{ message }}</div>
    {% endfor %}
    {% endwith %}
    <form method="POST">
        <label>Mechanic name: 
            <input type="text" name = "mechanic" placeholder="John" required>
        </label>
        <label>Store name:
            <input type="text" name = "store" placeholder = "Service centre" required>
        </label>
        <label>Odo Reading:
            <input type="number" name = "odo_reading" placeholder = "50000" required>
        </label>
        <label>Visit Date:
            <input type="date" id="visit_date"  name="visit_date" required>
        </label>
        <label>Description:</label>
        <textarea name="description">{{ car.description }}</textarea>
        <label>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
