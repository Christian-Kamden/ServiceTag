<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="alert {{ category }}">{{ message }}</div>
    {% endfor %}
    {% endwith %}
    <form method="POST">
        <label>Make: 
            <input type="text" name = "make" placeholder="volkswagen" required>
        </label>
        <label>Model:
            <input type="text" name = "model" placeholder = "Polo Tsi" required>
        </label>
        <label>Year:
            <input type="number" name = "year" placeholder = "2016" required>
        </label>
        <label>VIN:
            <input type="text" id="vin"  name="vin" placeholder = "JHMFB2F88CS079180" minlength="17" maxlength="17" required>
        </label>
        <label>Last Service Date:
            <input type="date" name = "last_service_date" required>
        </label>
        <label>
            <input type="password" name = "access_code" placeholder = "Access code:" required>
        </label>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
