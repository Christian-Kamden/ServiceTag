{% extends "base.html" %}
{% block title %} Sign Up {% endblock %}
    {% block content %}
        <h1>sign Up</h1>
        <form method="POST">
            <label>Enter Full Name: 
                <input type="text" name = "name" placeholder="please enter name" required>
            </label>
            <label>Enter E-mail Address:
                <input type="email" name = "email" placeholder = "example@gmail.com" required>
            </label>
            <label> Enter Phone Number:
                <input type="tel" id="phone"  name="phone_number" placeholder = "055 555 5555">
            </label>
            <label>Enter Password:
                <input type="password" name = "password" placeholder = "Please enter a password" minlength="8" required>
            </label>
            <button type="submit">Submit</button>
        </form>
    {% endblock %}
