<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my_cars</title>
</head>
<body>
    <form>
        {% for car in cars  %}
        <p><a href="{{ url_for('show_qr', token=car.qr_token) }}">
            {{car.make}}
            {{car.model}}
            {{car.year}}
        </a></p>
        {% else %}
        <p> no cars available</p>
        {% endfor %}
    </form>
</body>
</html>
