
    {% extends "base.html" %}
    {% block title %} My Cars {% endblock %}
    {% block content %}
        <ul>
            {% for car in cars %}
            <li>
                <a href = "{{url_for('show_qr', token=car.qr_token)}}">{{car.make}} {{car.model}} {{car.year}}</a>
                <a href = "{{url_for('delete',token=car.qr_token)}}">Delete</a>
            </li>
            {% else %}
                <li>No Car Available</li>
            {% endfor %}
        </ul>
    {% endblock %}
