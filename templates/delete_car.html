<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Car</title>
</head>
<body>
    <h1>Delete Car</h1>

    <p>Are you sure you want to remove {{car.make}} {{car.model}} {{car.year}}</p>
    <form action="{{url_for('delete',token=car.qr_token)}}" method="POST">
        <button><a href="{{url_for('my_cars')}}">Cancel</a></button>
        <button type="submit">Delete</button>
    </form>
</body>
</html>
