{% extends "base.html" %}
    {% block title %} Delete Car {% endblock %}
        {% block content %}
                <h1>Delete Car Information</h1>

                <p>Are you sure you want to remove {{car.make}} {{car.model}} {{car.year}}</p>
            <form action="{{url_for('delete',token=car.qr_token)}}" method="POST">
                <button><a href="{{url_for('my_cars')}}">Cancel</a></button>
                <button type="submit">Delete</button>
            </form>
        {% endblock %}
