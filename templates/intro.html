<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcome page</title>
</head>
<body>
    <section id="log">
        <h1>introduction page</h1>
        {% if current_user.is_authenticated %}
            <a href="{{ url_for('logout') }}">Log out</a> 
        {% else %}
            <a href="{{ url_for('login') }}">Log in</a>
        {% endif %}
    </section>
    
    <section id="my_cars">
        <a href="{{url_for('my_cars')}}">My Cars</a>
    </section>

    <section id="register">
        {% if current_user.is_authenticated %}
        <button><a href="{{url_for('reg')}}">Register Car</a></button>
        {% endif %}
    </section>
</body>
</html>
